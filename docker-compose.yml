services:
  status-board:
    # Swap `build: .` for the published image to skip building locally:
    #   image: ghcr.io/timblazing/status-board:latest
    build: .
    image: status-board
    container_name: status-board
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      # A directory is mounted, not the file itself. Most editors save by
      # writing a temp file and renaming it over the original, which swaps the
      # inode — a single-file bind mount still points at the old one and the
      # container stops seeing the file at all. Mounting the directory keeps
      # config hot-reload working with every editor.
      - ./config:/config:ro

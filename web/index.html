<!doctype html>
<html lang="en" data-theme="system" data-resolved="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Service status" />
    <title>Status</title>
    <script>
      // Resolve the OS preference before first paint so the page never flashes
      // the wrong theme. The configured theme arrives with the first
      // /api/status response and takes over from there.
      (function () {
        var el = document.documentElement;
        el.dataset.resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

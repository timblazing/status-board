# ─────────────────────────────────────────────────────────────────────────────
# Status Board configuration
#
# The only required key is `services`. Everything else has a sensible default,
# so the shortest useful config is just:
#
#   services:
#     - name: My Site
#       url: https://example.com
#
# Commented-out keys below show the default value unless noted otherwise.
#
# This file is watched: saving a change applies it within a second, with no
# restart and no page refresh. `port` is the exception — it needs a restart to
# bind. If an edit doesn't parse, the error is logged and the previous config
# keeps running.
# ─────────────────────────────────────────────────────────────────────────────

# Heading on the card, and the browser tab title.
# title: Status

# URL of an image to use as the browser tab icon. Defaults to a built-in green
# activity glyph.
# favicon: https://example.com/logo.png

# dark | light | system  — `system` follows the viewer's OS setting.
# theme: system

# Port the server listens on inside the container.
# port: 8080

# Seconds between checks of each service. Checks are staggered across this
# window so they don't all fire at once.
# check_interval: 60

# Seconds between browser refreshes. Polling pauses while the tab is hidden,
# so a board left open on a wall display costs one request a minute.
# refresh_interval: 30

# Number of history bars kept per service. The bars cover roughly
# history_size × check_interval of time — 30 × 60s = 30 minutes.
# history_size: 30

# Optional. When set, a service that responds successfully but takes longer
# than this many milliseconds shows as Degraded instead of Operational.
# Unset by default: a slow response is still a working response, and ordinary
# network jitter would otherwise flip healthy services amber. Turn it on only
# if you actually want latency alerting. Can be overridden per service.
# degraded_threshold_ms: 2000

# Show an icon to the left of each service name. Brand logos come from
# svgl.app, looked up once per domain on the server and cached; anything svgl
# doesn't know falls back to that site's own favicon. A service with neither
# shows no icon. Set to false to hide icons entirely, per-service `icon` too.
# icons: true

# Toggle pieces of the row on or off.
# show:
#   description: true  # the line under each service name
#   bars: true         # the history bar strip
#   time_labels: true  # the "15m … now" labels under the bars

# ─────────────────────────────────────────────────────────────────────────────
# Services — the only required section.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # Minimal: just a name and a URL. With no `description`, the row shows the
  # URL itself, linked and opening in a new tab.
  - name: Web App
    url: https://example.com

  - name: API
    url: https://api.example.com/health
    description: Public REST API

  # Every per-service override, all optional:
  - name: Database
    url: https://db.example.com/healthz
    description: Primary Postgres cluster

    # Milliseconds before a check counts as down. Default 10000.
    timeout: 5000

    # Which HTTP statuses count as up. Default: any 2xx or 3xx.
    expected_status: [200, 204]

    # Opts this one service into latency grading, overriding the board-wide
    # degraded_threshold_ms. A database health check should answer fast.
    degraded_threshold_ms: 500

    # Overrides the looked-up logo with an image of your own. Ignored when
    # the board-wide `icons` is false.
    icon: https://db.example.com/icon.png

    # Sent with every check — useful for health endpoints behind a token.
    headers:
      Authorization: Bearer some-token
      X-Source: status-board

  - name: CDN
    url: https://cdn.example.com/health.json

  - name: Queue
    url: https://queue.example.com/ping
    description: Background job queue

# ─────────────────────────────────────────────────────────────────────────────
# Groups — optional. Omit this section entirely for a single flat list.
# Every service listed must exist in `services` above; any service you leave
# out of a group simply won't be shown.
# ─────────────────────────────────────────────────────────────────────────────

# groups:
#   - name: Core
#     services: [Web App, API]
#   - name: Infrastructure
#     services: [Database, CDN, Queue]
